version: '3.8'

services:
  nautilus-dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Main workspace
      - .:/workspaces/nautilus-playground
      # Add additional volumes as needed
      # - ~/work/perper-ray:/workspaces/perper-ray
    ports:
      - "8888:8888"  # JupyterLab
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    tty: true
    stdin_open: true
