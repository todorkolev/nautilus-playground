[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nautilus-playground"
version = "0.1.0"
description = "A playground for building algo trading systems with Nautilus Trader."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" } # Assuming MIT or similar, add LICENSE file later if needed
authors = [
  { name = "Your Name", email = "you@example.com" }, # Placeholder - user should update
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License", # Example license
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "nautilus_trader>=1.217.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pyarrow>=11.0.0", 
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1",
    "black>=23.3.0",
    "isort>=5.12.0",
    "pylint>=2.17.4",
    "uv>=0.1.18", # Include uv itself for consistency
]

[project.urls]
Homepage = "https://github.com/todorkolev/nautilus-playground"
Repository = "https://github.com/todorkolev/nautilus-playground.git"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.uv]
dev-dependencies = [
    "dev",
]